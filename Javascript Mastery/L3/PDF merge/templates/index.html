<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Merge App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📄 PDF Merge Tool</h1>
        <p>Select multiple PDF files in the order you want to merge.</p>

        <form action="/merge" method="post" enctype="multipart/form-data">

            <div class="drop-area" id="drop-area">
                <input type="file" name="pdfs" id="fileInput" multiple accept=".pdf" hidden>
                <p>Drag & Drop PDFs Here</p>
                <span>or</span>
                <button type="button" id="browseBtn">Browse Files</button>
            </div>

            <div id="fileList"></div>

            <button type="submit" class="merge-btn">Merge PDFs</button>
        </form>
    </div>
</div>

<script>
const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('fileInput');
const browseBtn = document.getElementById('browseBtn');
const fileList = document.getElementById('fileList');

browseBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', updateFileList);

dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('active');
});

dropArea.addEventListener('dragleave', () => {
    dropArea.classList.remove('active');
});

dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('active');
    fileInput.files = e.dataTransfer.files;
    updateFileList();
});

function updateFileList() {
    fileList.innerHTML = "";
    Array.from(fileInput.files).forEach(file => {
        const div = document.createElement('div');
        div.className = "file-item";
        div.textContent = file.name;
        fileList.appendChild(div);
    });
}
</script>

</body>
</html>
