<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <div class="quizBox">
            <h2 class="question">Question will appear here</h2>

            <div class="option">
                <input type="radio" name="option" id="opt1">
                <label for="opt1" class="option-text">Option 1</label>
            </div>

            <div class="option">
                <input type="radio" name="option" id="opt2">
                <label for="opt2" class="option-text">Option 2</label>
            </div>

            <div class="option">
                <input type="radio" name="option" id="opt3">
                <label for="opt3" class="option-text">Option 3</label>
            </div>

            <div class="option">
                <input type="radio" name="option" id="opt4">
                <label for="opt4" class="option-text">Option 4</label>
            </div>

            <div class="btn-box">
                <button id="next">Next</button>
            </div>

        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
